<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MRlaneous Reports</title>
  <meta name="description" content="MRlaneous job reports and updates." />

  <style>
    :root{
      --bg:#0b0b0f;
      --card:rgba(255,255,255,0.04);
      --border:rgba(255,255,255,0.14);
      --border2:rgba(255,255,255,0.18);
      --text:#fff;
      --muted:rgba(255,255,255,0.78);
      --shadow: 0 18px 60px rgba(0,0,0,.45);
      --radius:18px;
    }

    *{ box-sizing:border-box; }
    html { scroll-behavior: smooth; }
    body { font-family: system-ui, Arial; margin: 0; background: var(--bg); color: var(--text); }

    body::before{
      content:"";
      position:fixed; inset:-20%;
      background:
        radial-gradient(600px 300px at 20% 10%, rgba(255,255,255,0.10), transparent 60%),
        radial-gradient(560px 280px at 80% 20%, rgba(255,255,255,0.08), transparent 60%),
        radial-gradient(700px 380px at 55% 85%, rgba(255,255,255,0.06), transparent 60%);
      pointer-events:none;
      z-index:-1;
      filter: blur(6px);
    }

    .wrap { max-width: 1040px; margin: 0 auto; padding: 28px; }

    /* top bar */
    .topbar{
      position: sticky;
      top: 0;
      z-index: 50;
      backdrop-filter: blur(10px);
      background: rgba(11,11,15,0.7);
      border-bottom: 1px solid rgba(255,255,255,0.10);
    }
    .topbarInner{
      max-width: 1040px;
      margin: 0 auto;
      padding: 12px 28px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 12px;
    }
    .brand{
      display:flex;
      align-items:center;
      gap: 10px;
      min-width: 0;
    }
    .logo{
      width: 34px; height: 34px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(255,255,255,0.06);
      display:grid;
      place-items:center;
      font-weight: 900;
      letter-spacing: .5px;
    }
    .brandText{
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .navActions{
      display:flex;
      gap: 10px;
      align-items:center;
      flex-wrap: wrap;
      justify-content:flex-end;
    }
    .btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap: 8px;
      padding: 10px 12px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(0,0,0,0.25);
      color: #fff;
      text-decoration:none;
      font-weight: 800;
      cursor:pointer;
      transition: transform .12s ease, background .12s ease, border-color .12s ease;
      user-select:none;
    }
    .btn:hover{ transform: translateY(-1px); border-color: rgba(255,255,255,0.28); background: rgba(255,255,255,0.07); }
    .btn:active{ transform: translateY(0px) scale(.99); }

    h1 { font-size: 40px; margin: 0 0 6px; letter-spacing: -0.4px; }
    p { margin: 0 0 12px; line-height: 1.6; color: var(--muted); }

    .panel{
      margin-top: 16px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
    }

    .controls{
      display:flex;
      gap: 12px;
      align-items:center;
      flex-wrap: wrap;
      justify-content: space-between;
    }

    .search{
      flex: 1 1 320px;
      display:flex;
      gap: 10px;
      align-items:center;
    }

    input[type="text"]{
      width: 100%;
      border-radius: 14px;
      border: 1px solid var(--border2);
      padding: 12px;
      font-size: 15px;
      background: rgba(0,0,0,0.25);
      color: #fff;
      outline: none;
      transition: border-color .12s ease, background .12s ease;
    }
    input[type="text"]:focus{
      border-color: rgba(255,255,255,0.35);
      background: rgba(255,255,255,0.05);
    }

    .chips{
      display:flex;
      flex-wrap:wrap;
      gap: 10px;
      margin-top: 12px;
    }
    .chip{
      border: 1px solid rgba(255,255,255,0.16);
      background: rgba(255,255,255,0.03);
      color: rgba(255,255,255,0.9);
      border-radius: 999px;
      padding: 8px 12px;
      font-weight: 800;
      cursor:pointer;
      transition: transform .12s ease, border-color .12s ease, background .12s ease;
    }
    .chip:hover{ transform: translateY(-1px); border-color: rgba(255,255,255,0.28); background: rgba(255,255,255,0.08); }
    .chip.active{ border-color: rgba(255,255,255,0.38); background: rgba(255,255,255,0.10); }

    .list{ margin-top: 14px; display:grid; gap: 14px; }

    .card{
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      transition: transform .14s ease, border-color .14s ease, box-shadow .14s ease;
    }
    .card:hover{
      transform: translateY(-2px);
      border-color: rgba(255,255,255,0.22);
      box-shadow: var(--shadow);
    }
    .titleRow{
      display:flex;
      justify-content: space-between;
      gap: 12px;
      align-items:flex-start;
      flex-wrap: wrap;
    }
    h2 { margin: 0 0 8px; }
    a { color: #fff; opacity: .92; text-decoration:none; }
    .meta{ font-size: 12px; color: rgba(255,255,255,0.65); margin-top: 2px; }
    .tags{ display:flex; flex-wrap:wrap; gap: 8px; margin-top: 10px; }
    .tag{
      font-size: 12px;
      padding: 6px 10px;
      border-radius: 999px;
      border:1px solid rgba(255,255,255,0.14);
      color: rgba(255,255,255,0.78);
      background: rgba(255,255,255,0.03);
    }
    .small{ font-size: 12px; opacity: .75; color: rgba(255,255,255,0.68); margin-top: 10px; }
    .empty{
      padding: 16px;
      border-radius: 16px;
      border: 1px dashed rgba(255,255,255,0.22);
      color: rgba(255,255,255,0.75);
      background: rgba(255,255,255,0.03);
    }
  </style>
</head>

<body>
  <div class="topbar">
    <div class="topbarInner">
      <div class="brand">
        <div class="logo">M</div>
        <div class="brandText">MRlaneous • Reports</div>
      </div>
      <div class="navActions">
        <a class="btn" href="/">Home</a>
        <a class="btn" href="/#quote">Get a quote</a>
      </div>
    </div>
  </div>

  <div class="wrap">
    <h1>Reports</h1>
    <p>Job reports and updates.</p>

    <div class="panel">
      <div class="controls">
        <div class="search">
          <input id="search" type="text" placeholder="Search reports… (client, job type, street, whatever)" />
        </div>
        <button id="sortBtn" class="btn" type="button" aria-pressed="true" title="Toggle newest/oldest">
          Newest first
        </button>
      </div>

      <div class="chips" style="margin-top:12px;">
        <button class="chip active" type="button" data-tag="all">All</button>
        <button class="chip" type="button" data-tag="cleaning">Cleaning</button>
        <button class="chip" type="button" data-tag="deep-clean">Deep clean</button>
        <button class="chip" type="button" data-tag="repairs">Repairs</button>
        <button class="chip" type="button" data-tag="maintenance">Maintenance</button>
      </div>

      <div class="small">Tip: tags + search stack together.</div>
    </div>

      <div class="list" id="list">
      <!-- No reports yet -->
      </div>

      <div id="empty" class="empty" style="margin-top:14px;">
     No jobs have been recorded yet.
      </div>
      <div id="empty" class="empty" style="display:none; margin-top:14px;">
      No reports match that. Try a different search or clear the tag.
    </div>

    <p style="margin-top:20px;"><a class="btn" href="/">← Back to home</a></p>
  </div>

  <script>
    const search = document.getElementById("search");
    const list = document.getElementById("list");
    const empty = document.getElementById("empty");
    const sortBtn = document.getElementById("sortBtn");
    const chips = Array.from(document.querySelectorAll(".chip"));
    let activeTag = "all";
    let newestFirst = true;

    function normalize(s){ return (s || "").toLowerCase().trim(); }

    function applyFilters(){
      const q = normalize(search.value);
      const items = Array.from(list.querySelectorAll(".report"));
      let shown = 0;

      items.forEach(card => {
        const title = normalize(card.dataset.title);
        const tags = normalize(card.dataset.tags);
        const hay = `${title} ${tags}`;

        const tagOk = (activeTag === "all") ? true : tags.includes(activeTag);
        const qOk = q ? hay.includes(q) : true;

        const ok = tagOk && qOk;
        card.style.display = ok ? "" : "none";
        if(ok) shown++;
      });

      empty.style.display = shown === 0 ? "" : "none";
    }

    function sortCards(){
      const items = Array.from(list.querySelectorAll(".report"));
      items.sort((a,b) => {
        const ad = a.dataset.date || "";
        const bd = b.dataset.date || "";
        return newestFirst ? bd.localeCompare(ad) : ad.localeCompare(bd);
      });
      items.forEach(i => list.appendChild(i));
    }

    // tag chips
    chips.forEach(chip => {
      chip.addEventListener("click", () => {
        chips.forEach(c => c.classList.remove("active"));
        chip.classList.add("active");
        activeTag = chip.dataset.tag;
        applyFilters();
      });
    });

    // search
    search.addEventListener("input", applyFilters);

    // sort
    sortBtn.addEventListener("click", () => {
      newestFirst = !newestFirst;
      sortBtn.textContent = newestFirst ? "Newest first" : "Oldest first";
      sortCards();
    });

    // initial
    sortCards();
    applyFilters();
  </script>
</body>
</html>
